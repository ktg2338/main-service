name: Build and Deploy to Azure Container Apps

on:
  push:
    branches: [ main ]

env:
  AZURE_RESOURCE_GROUP: 'aif-prod-rg'
  AZURE_CONTAINER_REGISTRY: 'aifprodacr'
  AZURE_CONTAINER_APP_NAME: 'competition-prod'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (Service Principal Secret)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR Login (no password)
        run: az acr login -n ${{ env.AZURE_CONTAINER_REGISTRY }}

      - name: Build & Push
        run: |
          IMG=${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.AZURE_CONTAINER_APP_NAME }}:${{ github.sha }}
          docker build -t "$IMG" .
          docker push "$IMG"

      - name: Update Container App Image
        run: |
          az containerapp update \
            -g ${{ env.AZURE_RESOURCE_GROUP }} \
            -n ${{ env.AZURE_CONTAINER_APP_NAME }} \
            --image ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.AZURE_CONTAINER_APP_NAME }}:${{ github.sha }}

      #시크릿 변경
      #      - name: Set ACA secrets
#        run: |
#          az containerapp secret set \
#            -g ${{ env.AZURE_RESOURCE_GROUP }} \
#            -n ${{ env.AZURE_CONTAINER_APP_NAME }} \
#            --secrets \
#              azure-monitor-connection-string="${{ secrets.AZURE_MONITOR_CONNECTION_STRING }}" \
#              db-url="${{ secrets.DB_URL }}" \
#              db-username="${{ secrets.DB_USERNAME }}" \
#              db-password="${{ secrets.DB_PASSWORD }}"
#
#      - name: Link secrets to env vars
#        run: |
#          az containerapp update \
#            -g ${{ env.AZURE_RESOURCE_GROUP }} \
#            -n ${{ env.AZURE_CONTAINER_APP_NAME }} \
#            --set-env-vars \
#              SPRING_PROFILES_ACTIVE=prod \
#              AZURE_MONITOR_CONNECTION_STRING=secretref:azure-monitor-connection-string \
#              DB_URL=secretref:db-url \
#              DB_USERNAME=secretref:db-username \
#              DB_PASSWORD=secretref:db-password \
#            --image ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.AZURE_CONTAINER_APP_NAME }}:${{ github.sha }}

      - name: Cleanup old images (keep last 10)
        continue-on-error: true
        run: |
          TAGS=$(az acr repository show-tags \
            -n ${{ env.AZURE_CONTAINER_REGISTRY }} \
            --repository ${{ env.AZURE_CONTAINER_APP_NAME }} \
            --orderby time_desc --output tsv | tail -n +11)

          for tag in $TAGS; do
            az acr repository delete \
              -n ${{ env.AZURE_CONTAINER_REGISTRY }} \
              --image ${{ env.AZURE_CONTAINER_APP_NAME }}:$tag \
              --yes || true
          done
